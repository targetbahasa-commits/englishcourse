<!DOCTYPE html>
<html>

<head>
    <title>IELTS Data Diagnostic</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-50 p-8">
    <div class="max-w-4xl mx-auto bg-white p-6 rounded-lg shadow">
        <h1 class="text-2xl font-bold mb-4">Real-Time Data Inspector</h1>
        <p class="text-sm text-gray-600 mb-4">Open browser console (F12) and check the Network tab</p>

        <div class="mb-4">
            <label class="block font-semibold mb-2">Essay Text:</label>
            <textarea id="essay" class="w-full p-2 border rounded"
                rows="5">Some people believe that social media has a negative impact on society.</textarea>
        </div>

        <button onclick="testAPI()" class="bg-blue-500 text-white px-6 py-2 rounded hover:bg-blue-600">
            Test API Call
        </button>

        <div id="output" class="mt-6 p-4 bg-gray-100 rounded font-mono text-xs overflow-auto max-h-96"></div>
    </div>

    <script>
        async function testAPI() {
            const essay = document.getElementById('essay').value;
            const output = document.getElementById('output');
            output.innerHTML = '<div class="text-blue-600">Testing...</div>';

            try {
                const response = await fetch('/assignments/ielts/writing/correct', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRF-TOKEN': '{{ csrf_token() }}'
                    },
                    body: JSON.stringify({ essay, task_type: '2' })
                });

                const data = await response.json();
                console.log('RAW API RESPONSE:', data);

                let report = [];
                report.push('=== RAW RESPONSE ===');
                report.push(JSON.stringify(data, null, 2));
                report.push('\n=== FIELD CHECK ===');
                report.push(`correction_html exists: ${!!data.correction_html}`);
                report.push(`correction_html type: ${typeof data.correction_html}`);
                report.push(`correction_html length: ${data.correction_html?.length}`);
                report.push(`Contains "undefined": ${String(data.correction_html).includes('undefined')}`);
                report.push(`Equals "undefined": ${data.correction_html === 'undefined'}`);

                output.innerHTML = '<pre>' + report.join('\n') + '</pre>';
            } catch (e) {
                output.innerHTML = '<div class="text-red-600">ERROR: ' + e.message + '</div>';
            }
        }
    </script>
</body>

</html>
