<!DOCTYPE html>
<html>
<head>
<style>
  body { background: #333; padding: 50px; }
  .desktop-animated-border {
      position: relative;
      padding: 3px;
      border-radius: 0.75rem;
      overflow: hidden;
      z-index: 1;
      width: 800px;
      height: 60px;
      margin: auto;
  }
  .desktop-animated-border::before {
      content: '';
      position: absolute;
      width: 300%;
      height: 3000%;
      left: -100%;
      top: -1450%;
      z-index: -1;
      background: conic-gradient(transparent 70%, #3b82f6 85%, #ec4899 100%);
      animation: rotate-border-transform 4s linear infinite;
  }
  .desktop-animated-border-inner {
      background-color: #f3f4f6;
      border-radius: calc(0.75rem - 3px);
      height: 100%;
      width: 100%;
  }
  @keyframes rotate-border-transform {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
  }
</style>
</head>
<body>
  <div class="desktop-animated-border">
    <div class="desktop-animated-border-inner">
       Toolbar content
    </div>
  </div>
</body>
</html>
